# BARO-PICK Delivery 자동 검증: 백엔드(H2·PostgreSQL), Flutter 3개 패키지, 관리 화면.
# 비밀값을 쓰지 않는다 — 카카오 실호출 테스트(-PkakaoLive)는 실행하지 않으며 키 없이 동작하는 경로만 검증한다.
name: delivery-ci

on:
  push:
    branches: [feature/delivery-lab, main]
    paths:
      - 'delivery-service/**'
      - 'apps/**'
      - 'simulator-admin/**'
      - '.github/workflows/delivery-ci.yml'
  pull_request:
    paths:
      - 'delivery-service/**'
      - 'apps/**'
      - 'simulator-admin/**'
      - '.github/workflows/delivery-ci.yml'
  workflow_dispatch:

concurrency:
  # push 와 PR 이 같은 브랜치에서 중복 실행되지 않도록 브랜치 이름으로 묶는다
  group: delivery-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db: [h2, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: delivery_test
          POSTGRES_USER: delivery
          POSTGRES_PASSWORD: ci-only-not-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U delivery -d delivery_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: delivery-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: test (H2, PostgreSQL 모드)
        if: matrix.db == 'h2'
        run: ./gradlew test --console=plain
      - name: test (PostgreSQL 17)
        if: matrix.db == 'postgres'
        run: >-
          ./gradlew test --console=plain
          -PtestDbUrl=jdbc:postgresql://127.0.0.1:5432/delivery_test
          -PtestDbUser=delivery -PtestDbPassword=ci-only-not-secret
      - name: test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ matrix.db }}
          path: delivery-service/build/reports/tests/

  flutter:
    name: flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: delivery_common
        working-directory: apps/delivery_common
        run: flutter pub get && flutter analyze && flutter test
      - name: customer_app
        working-directory: apps/customer_app
        run: flutter pub get && flutter analyze && flutter test
      - name: rider_app
        working-directory: apps/rider_app
        run: flutter pub get && flutter analyze && flutter test

  admin:
    name: simulator-admin (build = tsc -b + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: simulator-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: simulator-admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
