server:
  port: ${PORT:8080}
  address: 0.0.0.0   # 휴대폰(LAN) 접근용. 방화벽은 별도 승인 필요

spring:
  application:
    name: delivery-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    # 외부 HTTP 요청 헤더(카카오 키 포함)를 절대 로깅하지 않도록 DEBUG 금지
    org.springframework.web.client: INFO
    org.apache.hc: INFO

kakao:
  # 서버 전용. 값은 환경변수로만 주입한다. 로그·응답에 출력 금지
  rest-api-key: ${KAKAO_REST_API_KEY:}
  local-base-url: https://dapi.kakao.com
  mobility-base-url: https://apis-navi.kakaomobility.com
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

delivery:
  auth:
    secret: ${DELIVERY_AUTH_SECRET:}
    token-ttl-minutes: 720
    internal-token: ${DELIVERY_INTERNAL_TOKEN:}
  outbox:
    oms-endpoint: ${DELIVERY_OMS_EVENT_ENDPOINT:}
    relay-interval-ms: 2000
  # 운영 정책값 (DECISIONS.md P-01~P-14). 아래는 2026-11-02 확정된 값만 둔다. 나머지 미확정 값은 기본값 없음 → 미설정 시 해당 기능 차단.
  policy:
    offer-ttl-seconds: ${DELIVERY_OFFER_TTL_SECONDS:60}               # P-01 확정: 배차 제안 응답 제한시간
    max-concurrent-deliveries: ${DELIVERY_MAX_CONCURRENT_DELIVERIES:3} # P-10 확정: 라이더 동시 수행 최대 건수
    dispatch-radius-meters: ${DELIVERY_DISPATCH_RADIUS_M:3000}         # P-02 확정: 근거리 배차 반경 기본값(MFC 별 radius-meters 가 우선)
  # 고객 도착 판정 (2026-11-02 결정 정책, DECISIONS.md A-01~A-03). 모든 프로필 공통. 환경별 조정은 외부 설정으로 덮어쓴다.
  arrival:
    max-distance-meters: ${DELIVERY_ARRIVAL_MAX_DISTANCE_M:150}
    max-location-age-seconds: ${DELIVERY_ARRIVAL_MAX_LOCATION_AGE_S:30}
    max-accuracy-meters: ${DELIVERY_ARRIVAL_MAX_ACCURACY_M:50}
  mfcs: []
  simulation:
    enabled: false
